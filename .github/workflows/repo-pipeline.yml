name: repo-pipeline

on:
  workflow_call:
    inputs:
      repo_type:
        description: Repository type
        required: false
        type: string
        default: ios

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci ok for ${{ inputs.repo_type }}"

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "security-scan ok"

  ai-review:
    name: ai-review
    runs-on: ubuntu-latest
    steps:
      - run: echo "ai-review ok"
